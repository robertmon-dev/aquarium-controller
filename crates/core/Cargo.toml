[package]
name = "aquarium-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.40", default-features = false, features = ["sync", "net", "rt", "time"] }
tracing = { version = "0.1", default-features = false }
picoserve = { version = "0.20.1", features = ["alloc", "tokio", "json"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt", "macros", "time", "net", "io-util", "sync", "test-util"] }
serde_json = "1.0"
